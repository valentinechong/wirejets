
name: wirejets
recipe: laravel

config:
  php: '8.3'
  composer_version: '2-latest'
  via: apache
  webroot: public
  database: mysql:8.0
  cache: none
  xdebug: false

services:
  database:
    portforward: ${DB_EXT_PORT:-54630}

  node:
    type: node:22
    port: 5200
    command: tail -f /dev/null

tooling:
  npm:
    service: node
  node:
    service: node
  php:
    service: appserver

proxy:
  appserver:
    - wirejets.lndo.site

  node:
    - wirejets.lndo.site:5200
